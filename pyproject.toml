[project]
name = "data-modeling-museum"
version = "0.1.0"
description = "One coffee chain, four data models: 3NF, Kimball, Data Vault 2.0 and One Big Table in dbt + DuckDB, measured side by side."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.1",
    "faker>=40.63.0",
    "numpy>=2.4.6",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "sqlglot>=30.35.0",
]

[project.scripts]
museum = "museum.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "museum"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
